<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#050f08"/>

  <!-- Antenna base -->
  <rect x="30" y="3" width="4" height="8" rx="2" fill="#22c55e"/>
  <!-- Antenna ball -->
  <circle cx="32" cy="3" r="3" fill="#4ade80"/>

  <!-- Robot head -->
  <rect x="10" y="11" width="44" height="30" rx="7" fill="#0d2414" stroke="#22c55e" stroke-width="1.8"/>

  <!-- Left eye -->
  <rect x="16" y="19" width="12" height="10" rx="3" fill="#22c55e" opacity="0.15"/>
  <rect x="16" y="19" width="12" height="10" rx="3" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="22" cy="24" r="3.5" fill="#22c55e"/>
  <circle cx="23.5" cy="22.5" r="1" fill="#86efac"/>

  <!-- Right eye -->
  <rect x="36" y="19" width="12" height="10" rx="3" fill="#22c55e" opacity="0.15"/>
  <rect x="36" y="19" width="12" height="10" rx="3" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="42" cy="24" r="3.5" fill="#22c55e"/>
  <circle cx="43.5" cy="22.5" r="1" fill="#86efac"/>

  <!-- Mouth / speaker grille -->
  <rect x="20" y="35" width="24" height="3" rx="1.5" fill="#22c55e" opacity="0.6"/>
  <rect x="24" y="35" width="2" height="3" rx="1" fill="#22c55e"/>
  <rect x="29" y="35" width="2" height="3" rx="1" fill="#22c55e"/>
  <rect x="34" y="35" width="2" height="3" rx="1" fill="#22c55e"/>
  <rect x="39" y="35" width="2" height="3" rx="1" fill="#22c55e"/>

  <!-- Neck -->
  <rect x="26" y="41" width="12" height="5" rx="2" fill="#0d2414" stroke="#22c55e" stroke-width="1.5"/>

  <!-- Body / chest -->
  <rect x="14" y="46" width="36" height="15" rx="5" fill="#0d2414" stroke="#22c55e" stroke-width="1.8"/>

  <!-- Chest indicator lights -->
  <circle cx="24" cy="53" r="2.5" fill="#22c55e"/>
  <circle cx="32" cy="53" r="2.5" fill="#4ade80" opacity="0.7"/>
  <circle cx="40" cy="53" r="2.5" fill="#22c55e" opacity="0.5"/>

  <!-- Left ear bolt -->
  <circle cx="9" cy="23" r="3" fill="#0d2414" stroke="#22c55e" stroke-width="1.5"/>
  <!-- Right ear bolt -->
  <circle cx="55" cy="23" r="3" fill="#0d2414" stroke="#22c55e" stroke-width="1.5"/>
</svg>